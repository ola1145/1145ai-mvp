name: e2e
on:
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * *"
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run end-to-end gate (P8 builds tests/e2e)
        working-directory: tests/e2e
        env:
          E2E_STAGE: dev
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ ! -f package.json ]; then echo "tests/e2e not built yet (P8)"; exit 0; fi
          npm ci && npm test
