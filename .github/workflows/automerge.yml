name: automerge
# Enables GitHub auto-merge (squash) on tagged agent PRs. Uses a PAT so the merge commit triggers deploy workflows
# (merges performed with GITHUB_TOKEN do not start new workflow runs).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, edited, labeled, unlabeled, synchronize]
permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.title, '[1145:') && github.event.pull_request.draft == false
    steps:
      - name: Enable or disable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BLOCKED: ${{ contains(github.event.pull_request.labels.*.name, 'do-not-merge') }}
        run: |
          if [ "$BLOCKED" = "true" ]; then gh pr merge "$PR" --repo "$REPO" --disable-auto || true; exit 0; fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash
