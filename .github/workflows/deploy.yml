name: deploy
# main green -> deploy dev -> e2e -> (owner approves) -> prod. AWS access via OIDC roles from GithubOidcStack:
# no long-lived AWS keys live in GitHub. Role ARNs are repo variables (AWS_DEV_DEPLOY_ROLE_ARN, AWS_PROD_DEPLOY_ROLE_ARN).
# Each role trusts only repo:<repo>:environment:<env>, so the prod job needs the reviewer approval on the prod environment.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Deploy exactly the commit CI approved, in every job, even if main moves while we wait for the owner.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  dev:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ env.DEPLOY_SHA }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the deploy role is configured
        env: { ROLE_ARN: "${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}" }
        run: '[ -n "$ROLE_ARN" ] || { echo "::error::Repo variable AWS_DEV_DEPLOY_ROLE_ARN is empty. See infra/cdk/bin/BOOTSTRAP.md."; exit 1; }'
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}", aws-region: us-east-1, role-session-name: gha-deploy-dev }
      - run: pnpm cdk deploy --all -c stage=dev --require-approval never
        working-directory: infra/cdk

  e2e:
    needs: dev
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  prod:
    needs: e2e
    environment: prod # protected: waits for the owner's approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ env.DEPLOY_SHA }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Check the deploy role is configured
        env: { ROLE_ARN: "${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}" }
        run: '[ -n "$ROLE_ARN" ] || { echo "::error::Repo variable AWS_PROD_DEPLOY_ROLE_ARN is empty. See infra/cdk/bin/BOOTSTRAP.md."; exit 1; }'
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}", aws-region: us-east-1, role-session-name: gha-deploy-prod }
      - run: pnpm cdk deploy --all -c stage=prod --require-approval never
        working-directory: infra/cdk
