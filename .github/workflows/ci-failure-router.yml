name: ci-failure-router
# Sends a failing check back to the agent that authored the PR.
# Runs from the default branch (workflow_run), never from the PR's code. Branch names, job names and logs are untrusted
# text: they go through env vars and scripts/ci/sanitize-log.sh, never into the shell or into an @mention.
#
# Two comments, on purpose (threat model SEC-02):
#   1. the one that mentions the agent. It is posted with the PAT, so it wakes the agent and its whole text becomes the
#      agent's prompt. It holds only the job names (sanitized) and the run id, never the log. The agent reads the log
#      itself with `gh run view <id> --log-failed`.
#   2. the log tail, in a code block with no mention, posted with the workflow token, which cannot start a workflow.
# Never put the log tail in comment 1, and never mention an agent on a fork PR.
on:
  workflow_run:
    workflows: [ci, claude-review]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  route:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - env:
          # Comments made with GITHUB_TOKEN do not start workflows, so the PAT is what lets "@claude" reach claude.yml.
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || github.token }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SAME_REPO: ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
        run: |
          set -euo pipefail
          [ -n "${PR:-}" ] || PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')
          [ -n "${PR:-}" ] || exit 0
          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author --jq .author.login)
          JOBS=$(GH_TOKEN="$READ_TOKEN" gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '[.jobs[]|select(.conclusion=="failure")|.name]|join(", ")' | bash scripts/ci/sanitize-log.sh)
          LOG=$(GH_TOKEN="$READ_TOKEN" gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -n 40 | bash scripts/ci/sanitize-log.sh || true)
          WHO=""
          if [ "$SAME_REPO" = "true" ]; then WHO=$(bash scripts/ci/route-agent.sh "$AUTHOR" "$BRANCH"); fi
          {
            echo "${WHO:+$WHO }CI failed on: **$JOBS**. Please fix it on this branch without widening file ownership or editing lockfiles."
            echo "Read the failing log with: gh run view $RUN_ID --repo $REPO --log-failed"
          } > mention.md
          gh pr comment "$PR" --repo "$REPO" --body-file mention.md
          {
            echo '<details><summary>Failing log (tail)</summary>'
            echo
            echo '```'
            echo "$LOG"
            echo '```'
            echo '</details>'
          } > log.md
          GH_TOKEN="$READ_TOKEN" gh pr comment "$PR" --repo "$REPO" --body-file log.md
