name: ci-failure-router
# Sends a failing check back to the agent that authored the PR, with the failing jobs and the log tail.
# Runs from the default branch (workflow_run), never from the PR's code. Branch names and logs are untrusted text:
# they go through env vars and scripts/ci/sanitize-log.sh, never into the shell or into an @mention.
on:
  workflow_run:
    workflows: [ci, claude-review]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  route:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - env:
          # Comments made with GITHUB_TOKEN do not start workflows, so the PAT is what lets "@claude" reach claude.yml.
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || github.token }}
          READ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          [ -n "${PR:-}" ] || PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')
          [ -n "${PR:-}" ] || exit 0
          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author --jq .author.login)
          JOBS=$(GH_TOKEN="$READ_TOKEN" gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '[.jobs[]|select(.conclusion=="failure")|.name]|join(", ")')
          LOG=$(GH_TOKEN="$READ_TOKEN" gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -n 40 | bash scripts/ci/sanitize-log.sh || true)
          WHO=$(bash scripts/ci/route-agent.sh "$AUTHOR" "$BRANCH")
          {
            echo "${WHO:+$WHO }CI failed on: **$JOBS**. Please fix it on this branch without widening file ownership or editing lockfiles."
            echo
            echo '<details><summary>Failing log (tail)</summary>'
            echo
            echo '```'
            echo "$LOG"
            echo '```'
            echo '</details>'
          } > body.md
          gh pr comment "$PR" --repo "$REPO" --body-file body.md
