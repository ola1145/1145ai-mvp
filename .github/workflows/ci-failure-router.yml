name: ci-failure-router
# Sends a failing check back to the agent that authored the PR, with the failing jobs and the log tail.
on:
  workflow_run:
    workflows: [ci, claude-review]
    types: [completed]
permissions:
  pull-requests: write
  actions: read

jobs:
  route:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          [ -n "${PR:-}" ] || PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number')
          [ -n "${PR:-}" ] || exit 0
          AUTHOR=$(gh pr view "$PR" --repo "$REPO" --json author --jq .author.login)
          JOBS=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs --jq '[.jobs[]|select(.conclusion=="failure")|.name]|join(", ")')
          LOG=$(gh run view "$RUN_ID" --repo "$REPO" --log-failed 2>/dev/null | tail -n 40 | cut -c1-300 || true)
          case "$AUTHOR$BRANCH" in
            *devin*)  WHO="Devin";;                 # Devin watches comments on its own PRs
            *cursor*) WHO="@cursor";;
            *claude*) WHO="@claude";;
            *)        WHO="";;
          esac
          {
            echo "$WHO CI failed on: **$JOBS**. Please fix on this branch without widening file ownership or editing lockfiles."
            echo
            echo '<details><summary>Failing log (tail)</summary>'
            echo
            echo '```'
            echo "$LOG"
            echo '```'
            echo '</details>'
          } > body.md
          gh pr comment "$PR" --repo "$REPO" --body-file body.md
