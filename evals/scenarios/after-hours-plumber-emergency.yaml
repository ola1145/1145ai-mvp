agent: customer
channel: voice
tenant_fixture: plumber-allen-after-hours
tags: ["after-hours", "emergency"]
greeting: "Hi, Allen Plumbing, this is Sam. I'm the AI receptionist and this call is recorded. We're closed for the night, but I can still help. What's going on?"
turns:
  - caller: "My pipe burst and water is everywhere!"
    fake: { reply: "Oh no. Shut off the main valve if you can. I'm getting the on-call plumber now. What's your address?", tools: ["transfer_to_team"] }
    expect: { tools_called: ["transfer_to_team"], reply_contains_any: ["valve", "on-call"], reply_max_words: 35 }
rules:
  first_utterance_contains: ["AI", "recorded"]
