agent: admin
channel: telegram
tenant_fixture: barber-frisco
tags: ["admin"]
api:
  "GET /v1/admin/reports/summary": { calls: 5, bookings: 3, newCustomers: 1, missedCalls: 0, topQuestions: [] }
turns:
  - owner: "How'd today go?"
    fake: { reply: "Good one: five calls and three bookings, one from a new customer. Nothing needs you.", tools: ["summary_report"] }
    expect: { tools_called: ["summary_report"], first_sentence_contains_any: ["five", "5", "three", "3"], reply_max_chars: 200, reply_not_contains: ["Here's your", "summary report", "Overall"] }
