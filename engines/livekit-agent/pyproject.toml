[project]
name = "frontdesk"
version = "0.1.0"
description = "1145ai customer agent (voice + web chat) on LiveKit, one worker for all tenants"
requires-python = ">=3.12"
dependencies = [
  # Exact pins: plugin argument names change between minor releases (AgentSession moved to turn_handling in 1.8).
  # Bump all of these together, re-run tests/test_agent.py, and check the LiveKit docs before changing a version.
  "livekit-agents[deepgram,elevenlabs,aws,silero,turn-detector]==1.8.4",
  "livekit-plugins-deepgram==1.8.4",
  "livekit-plugins-elevenlabs==1.8.4",
  "livekit-plugins-aws==1.8.4",
  "livekit-plugins-silero==1.8.4",
  "livekit-plugins-turn-detector==1.8.4",
  "livekit-api==1.2.1",
  "httpx>=0.27",
  "botocore>=1.35",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
